[project]
name = "synesis-coder"
version = "0.10.0"
description = "LLM-assisted annotation pipeline for the Synesis ecosystem"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only AND LicenseRef-Synesis-data-output-exception"
license-files = ["LICENSE", "LICENSE.exception"]
authors = [
    {name = "De Britto, Christian Maciel", email = "chriseana@gmail.com"}
]
keywords = [
    "synesis",
    "llm",
    "annotation",
    "knowledge-engineering",
    "qualitative-research",
    "ontology",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Linguistic",
    "Operating System :: OS Independent",
]
dependencies = [
    "synesis>=0.12.0",
    "anthropic>=0.77.1",
    "openai>=1.0",
    "click>=8.0",
    "tenacity>=8.0",
    "bibtexparser>=1.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "build>=0.10",
    "pyyaml>=6.0",
    "tomli>=2.0 ; python_version < '3.11'",
    "ruff==0.16.1",
    "mypy==2.3.0",
]

[project.urls]
Repository = "https://github.com/synesis-lang/synesis-coder"
Changelog = "https://github.com/synesis-lang/synesis-coder/blob/main/CHANGELOG.md"

[project.scripts]
synesis-coder = "synesis_coder.cli:main"

[tool.setuptools.packages.find]
include = ["synesis_coder*"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Por padrão, exclui testes de integração — eles gastam tokens de API real.
# Para rodá-los explicitamente: pytest -m integration (requer ANTHROPIC_API_KEY).
addopts = "-m 'not integration'"
markers = [
    "integration: testes que chamam a API LLM real (requerem ANTHROPIC_API_KEY)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Lenient baseline: bug-catching rules (F) and import sorting (I) enforced;
# cosmetic/modernization rules deferred (to be tightened incrementally).
select = ["F", "I"]
ignore = ["F541"]  # f-string-missing-placeholders (cosmetic)

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
