[project]
name = "synesis-coder"
version = "0.7.0"
requires-python = ">=3.10"
dependencies = [
    "synesis>=0.5.5",
    "anthropic>=0.40.0",
    "openai>=1.0",
    "click>=8.0",
    "tenacity>=8.0",
    "bibtexparser>=1.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff==0.15.17", "mypy==1.16.0"]

[project.scripts]
synesis-coder = "synesis_coder.cli:main"

[tool.setuptools.packages.find]
include = ["synesis_coder*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: testes que chamam a API LLM real (requerem ANTHROPIC_API_KEY)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Lenient baseline: bug-catching rules (F) and import sorting (I) enforced;
# cosmetic/modernization rules deferred (to be tightened incrementally).
select = ["F", "I"]
ignore = ["F541"]  # f-string-missing-placeholders (cosmetic)

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
